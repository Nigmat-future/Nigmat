<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nigmat Rahim — Bioinformatics & AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f1ea;
    --bg-tint: #ebe6db;
    --paper: #faf8f2;
    --ink: #1a1814;
    --ink-soft: #4a453d;
    --ink-mute: #7a7268;
    --rule: #d9d3c4;
    --rule-soft: #e6e1d2;
    --accent: #8a2c1b;      /* oxblood */
    --accent-soft: #b86a54;
    --mark: #d9b36a;
    --ok: #3d6b3a;
    --serif: "Newsreader", "Iowan Old Style", "Palatino", Georgia, serif;
    --display: "Fraunces", "Newsreader", Georgia, serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0e110f; --bg-tint:#14181a; --paper:#161a18; --ink:#eae4d6; --ink-soft:#c2bdad;
    --ink-mute:#857e70; --rule:#2a2d28; --rule-soft:#1e211d; --accent:#e08c70; --accent-soft:#b86a54; --mark:#d9b36a;
  }
  [data-theme="terminal"]{
    --bg:#0a0e0b; --bg-tint:#0d1110; --paper:#0f1412; --ink:#d6e4d4; --ink-soft:#9db39a;
    --ink-mute:#5e7a5d; --rule:#1e2a1f; --rule-soft:#14201a; --accent:#7fe3b0; --accent-soft:#51b98a; --mark:#d9b36a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh; transition: background .35s ease, color .35s ease;}
  a{color:inherit}
  ::selection{background:var(--mark);color:#1a1814}
  /* Layout shell */
  .shell{max-width:1180px;margin:0 auto;padding:0 40px}
  @media (max-width:720px){.shell{padding:0 20px}}

  /* ——— Top bar ——— */
  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule-soft)}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:500;font-variation-settings:"opsz" 12,"SOFT" 50;font-size:19px;letter-spacing:-0.01em}
  .brand-dot{width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
  .brand small{font-family:var(--mono);font-size:11px;color:var(--ink-mute);letter-spacing:0.04em;text-transform:uppercase;font-weight:400;margin-left:6px}
  .nav{display:flex;gap:2px;align-items:center}
  .nav a{font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);text-decoration:none;padding:8px 12px;border-radius:6px;transition:all .15s ease;letter-spacing:-0.005em}
  .nav a:hover{color:var(--ink);background:var(--bg-tint)}
  .nav a.active{color:var(--ink);background:var(--bg-tint)}
  .kbd{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border:1px solid var(--rule);border-radius:5px;color:var(--ink-mute);background:var(--paper);letter-spacing:0.02em}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);border-radius:8px;cursor:pointer;transition:all .15s}
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-mute)}
  .topbar-tools{display:flex;align-items:center;gap:10px}
  .cmdk-btn{display:inline-flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink-mute);font-family:var(--sans);font-size:12.5px;cursor:pointer;transition:all .15s}
  .cmdk-btn:hover{border-color:var(--ink-mute);color:var(--ink-soft)}
  .cmdk-btn .k{display:flex;gap:3px}
  @media (max-width:820px){.nav a{padding:6px 8px;font-size:12.5px} .cmdk-btn .lbl{display:none}}
  @media (max-width:640px){.nav a{display:none} .brand small{display:none}}

  /* ——— Hero ——— */
  .hero{padding:80px 0 72px;position:relative;overflow:hidden}
  .hero-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);letter-spacing:0.12em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:28px}
  .hero-meta .rule{flex:0 0 48px;height:1px;background:var(--ink-mute);opacity:.55}
  .hero h1{font-family:var(--display);font-weight:320;font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 0;font-size:clamp(52px, 9vw, 112px);line-height:0.94;letter-spacing:-0.03em;margin:0 0 26px;color:var(--ink)}
  .hero h1 em{font-style:italic;font-variation-settings:"opsz" 144,"SOFT" 100,"WONK" 1;color:var(--accent);font-weight:360}
  .hero-lede{font-family:var(--serif);font-size:clamp(19px, 2vw, 22px);line-height:1.55;color:var(--ink-soft);max-width:640px;margin:0 0 38px;font-weight:380}
  .hero-lede b{color:var(--ink);font-weight:520}
  .hero-stats{display:flex;flex-wrap:wrap;gap:44px;padding-top:30px;border-top:1px solid var(--rule)}
  .hero-stat .num{font-family:var(--display);font-weight:360;font-size:34px;color:var(--ink);font-variation-settings:"opsz" 48,"SOFT" 30;line-height:1;letter-spacing:-0.02em}
  .hero-stat .num .unit{font-family:var(--sans);font-size:13px;color:var(--ink-mute);font-weight:500;margin-left:4px;letter-spacing:0}
  .hero-stat .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.1em;margin-top:8px}

  /* Hero art — cellular dots */
  .hero-art{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:520px;height:520px;pointer-events:none;opacity:.85;mix-blend-mode: multiply}
  [data-theme="dark"] .hero-art, [data-theme="terminal"] .hero-art{mix-blend-mode:screen;opacity:.6}
  @media (max-width:1080px){.hero-art{opacity:.22;right:-140px}}
  @media (max-width:720px){.hero-art{display:none}}

  /* ——— Section chrome ——— */
  section{padding:88px 0;border-top:1px solid var(--rule-soft)}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:44px;gap:24px;flex-wrap:wrap}
  .sec-title{font-family:var(--display);font-weight:360;font-variation-settings:"opsz" 48;font-size:clamp(34px,4.5vw,52px);line-height:1;letter-spacing:-0.025em;color:var(--ink);margin:0;display:flex;align-items:baseline;gap:18px}
  .sec-title .num{font-family:var(--mono);font-size:12px;color:var(--ink-mute);font-weight:400;letter-spacing:0.1em;text-transform:uppercase;align-self:flex-start;margin-top:10px}
  .sec-sub{font-family:var(--sans);font-size:13px;color:var(--ink-mute);letter-spacing:0.01em;max-width:360px}

  /* ——— About ——— */
  .about-grid{display:grid;grid-template-columns: 1fr 1.3fr;gap:64px;align-items:start}
  @media (max-width:880px){.about-grid{grid-template-columns:1fr;gap:40px}}
  .portrait{aspect-ratio:4/5;background:var(--paper);border:1px solid var(--rule);position:relative;overflow:hidden}
  .portrait-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:
    repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--ink) 3%, transparent) 14px 15px);}
  .portrait-placeholder .mono{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);letter-spacing:0.12em;text-transform:uppercase}
  .portrait-meta{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:0.08em;text-transform:uppercase}
  .about-body p{font-size:18px;line-height:1.65;color:var(--ink-soft);margin:0 0 18px;max-width:56ch}
  .about-body p:first-child::first-letter{font-family:var(--display);font-size:68px;float:left;line-height:0.9;margin:6px 10px -2px 0;color:var(--accent);font-weight:360;font-variation-settings:"opsz" 144,"SOFT" 50}
  .about-body b{color:var(--ink);font-weight:520}
  .facts{margin-top:36px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
  .fact{background:var(--bg);padding:18px 22px}
  .fact .k{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
  .fact .v{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.35}
  .fact .v em{font-style:italic;color:var(--accent-soft)}

  /* ——— Publications ——— */
  .pubs-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);border-radius:999px;cursor:pointer;letter-spacing:0.02em;transition:all .15s}
  .chip:hover{border-color:var(--ink-mute);color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .pub{display:grid;grid-template-columns: 110px 1fr auto; gap:28px; padding:26px 0; border-top:1px solid var(--rule-soft); align-items:start}
  .pub:last-child{border-bottom:1px solid var(--rule-soft)}
  .pub-year{font-family:var(--mono);font-size:13px;color:var(--ink-mute);letter-spacing:0.04em;padding-top:4px}
  .pub-year .st{display:block;margin-top:6px;font-size:10.5px;padding:2px 7px;border:1px solid var(--rule);border-radius:999px;width:max-content;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase}
  .pub-year .st.review{color:var(--accent)}
  .pub-year .st.accepted{color:var(--ok)}
  .pub-title{font-family:var(--display);font-weight:400;font-variation-settings:"opsz" 24;font-size:22px;line-height:1.25;letter-spacing:-0.015em;color:var(--ink);margin:0 0 8px;max-width:52ch}
  .pub-authors{font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
  .pub-authors .me{color:var(--accent);font-weight:520;background:color-mix(in srgb, var(--accent) 8%, transparent);padding:0 3px;border-radius:2px}
  .pub-authors .co{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);vertical-align:super;margin-left:1px}
  .pub-venue{margin-top:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-mute);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pub-venue em{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:14px}
  .pub-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .pub-actions button{font-family:var(--mono);font-size:11px;padding:6px 10px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);cursor:pointer;border-radius:6px;text-transform:uppercase;letter-spacing:0.06em;transition:all .15s}
  .pub-actions button:hover{color:var(--ink);border-color:var(--ink-mute)}
  .pub-actions button.copied{color:var(--ok);border-color:var(--ok)}
  @media (max-width:720px){.pub{grid-template-columns:1fr;gap:10px} .pub-actions{flex-direction:row}}

  /* ——— Research projects ——— */
  .research-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:32px 28px}
  .rp{grid-column:span 6;background:var(--paper);border:1px solid var(--rule);padding:32px;position:relative;transition:all .2s ease}
  .rp:hover{border-color:var(--ink-mute);transform:translateY(-2px)}
  .rp.feature{grid-column:span 12;padding:42px;background:linear-gradient(135deg, var(--paper) 0%, color-mix(in srgb, var(--accent) 4%, var(--paper)) 100%)}
  @media (max-width:880px){.rp,.rp.feature{grid-column:span 12;padding:26px}}
  .rp-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:var(--mono);font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.1em}
  .rp-meta .tag{padding:3px 8px;border:1px solid var(--rule);border-radius:999px}
  .rp h3{font-family:var(--display);font-weight:380;font-variation-settings:"opsz" 36;font-size:28px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 12px;color:var(--ink)}
  .rp.feature h3{font-size:40px;font-weight:350;max-width:20ch}
  .rp p{font-size:15.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 20px;max-width:58ch}
  .rp-stats{display:flex;gap:28px;flex-wrap:wrap;padding-top:18px;border-top:1px dashed var(--rule)}
  .rp-stat .n{font-family:var(--display);font-weight:420;font-variation-settings:"opsz" 36;font-size:22px;color:var(--ink);line-height:1;letter-spacing:-0.015em}
  .rp-stat .n .u{font-family:var(--sans);font-size:11px;color:var(--ink-mute);font-weight:500;margin-left:3px}
  .rp-stat .l{font-family:var(--mono);font-size:10px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px}
  .rp-tech{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
  .rp-tech span{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);padding:2px 7px;background:var(--bg-tint);border-radius:3px;letter-spacing:0.02em}

  /* ——— OSS / GitHub projects ——— */
  .oss-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:980px){.oss-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.oss-grid{grid-template-columns:1fr}}
  .oss{background:var(--paper);border:1px solid var(--rule);padding:22px;display:flex;flex-direction:column;gap:12px;transition:all .2s ease;text-decoration:none;color:inherit;cursor:pointer}
  .oss:hover{border-color:var(--ink);transform:translateY(-2px)}
  .oss-top{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .oss-top .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .oss-name{font-family:var(--display);font-weight:420;font-size:19px;line-height:1.2;color:var(--ink);margin:0;letter-spacing:-0.01em}
  .oss-desc{font-size:14px;line-height:1.5;color:var(--ink-soft);flex:1;margin:0}
  .oss-arr{font-family:var(--mono);color:var(--ink-mute);font-size:13px;align-self:flex-end;transition:transform .2s, color .2s}
  .oss:hover .oss-arr{color:var(--accent);transform:translate(3px,-3px)}

  /* ——— Writing ——— */
  .posts{display:flex;flex-direction:column}
  .post{display:grid;grid-template-columns:160px 1fr 120px;gap:32px;padding:28px 0;border-top:1px solid var(--rule-soft);align-items:center;text-decoration:none;color:inherit;transition:padding .2s}
  .post:hover{padding-left:10px}
  .post:last-child{border-bottom:1px solid var(--rule-soft)}
  .post-date{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);letter-spacing:0.04em;text-transform:uppercase}
  .post-title{font-family:var(--display);font-weight:380;font-size:22px;line-height:1.25;letter-spacing:-0.015em;color:var(--ink);margin:0}
  .post-title em{font-style:italic;color:var(--accent)}
  .post-tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em;text-align:right}
  @media (max-width:720px){.post{grid-template-columns:1fr;gap:6px} .post-tag{text-align:left}}

  /* ——— Now / Contact ——— */
  .now-contact{display:grid;grid-template-columns:1.2fr 1fr;gap:56px}
  @media (max-width:880px){.now-contact{grid-template-columns:1fr;gap:40px}}
  .now-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .now-item{display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.55;color:var(--ink-soft)}
  .now-item .b{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
  .now-item b{color:var(--ink);font-weight:520}
  .contact-card{background:var(--paper);border:1px solid var(--rule);padding:32px}
  .contact-card h4{font-family:var(--display);font-weight:380;font-size:24px;margin:0 0 14px;letter-spacing:-0.01em}
  .contact-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .contact-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px dashed var(--rule)}
  .contact-row .k{font-family:var(--mono);font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.1em}
  .contact-row a{font-family:var(--serif);font-size:15.5px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
  .contact-row a:hover{border-bottom-color:var(--accent);color:var(--accent)}

  /* ——— Footer ——— */
  footer{padding:48px 0 64px;border-top:1px solid var(--rule-soft);margin-top:20px}
  .foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);letter-spacing:0.04em;flex-wrap:wrap;gap:12px}

  /* ——— Command palette ——— */
  .cmdk-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--ink) 40%, transparent);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100;animation:fadeIn .12s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .cmdk{width:560px;max-width:92vw;background:var(--paper);border:1px solid var(--rule);box-shadow:0 30px 80px -20px rgba(0,0,0,0.3);overflow:hidden;animation:popIn .16s ease}
  @keyframes popIn{from{transform:translateY(-8px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .cmdk input{width:100%;padding:20px 22px;border:0;background:transparent;color:var(--ink);font-family:var(--serif);font-size:18px;border-bottom:1px solid var(--rule);outline:none}
  .cmdk input::placeholder{color:var(--ink-mute);font-style:italic}
  .cmdk-list{max-height:400px;overflow-y:auto;padding:6px}
  .cmdk-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-soft)}
  .cmdk-row.on{background:var(--bg-tint);color:var(--ink)}
  .cmdk-row .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.06em}
  .cmdk-row .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink-mute);background:var(--bg);border:1px solid var(--rule);border-radius:4px}

  /* ——— Reading progress ——— */
  .progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:60;transition:width .08s linear}

  /* ——— Tweaks panel ——— */
  .tweaks{position:fixed;bottom:24px;right:24px;width:280px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 16px 40px -8px rgba(0,0,0,0.18);z-index:90;font-family:var(--sans);font-size:12.5px}
  .tweaks-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-mute);letter-spacing:0.1em}
  .tweaks-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
  .tweaks-row{display:flex;flex-direction:column;gap:6px}
  .tweaks-row label{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em}
  .tweaks-seg{display:flex;gap:2px;background:var(--bg-tint);padding:2px;border-radius:6px}
  .tweaks-seg button{flex:1;padding:6px 8px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:4px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.05em}
  .tweaks-seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.06)}
  .tweaks-close{cursor:pointer;border:0;background:transparent;color:var(--ink-mute);font-family:var(--mono);font-size:14px}
  @media (max-width:640px){.tweaks{bottom:12px;right:12px;left:12px;width:auto}}

  /* Lang pill */

// ————————— Hero art: cellular dot field ——————————
function CellDots() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = 520 * devicePixelRatio;
    const H = canvas.height = 520 * devicePixelRatio;
    canvas.style.width = '520px'; canvas.style.height='520px';
    const CX = W/2, CY = H/2;
    const nodes = [];
    const N = 140;
    for (let i=0;i<N;i++){
      const r = 60 + Math.random() * 180;
      const a = Math.random() * Math.PI*2;
      nodes.push({
        x: CX + r * Math.cos(a) * devicePixelRatio,
        y: CY + r * Math.sin(a) * devicePixelRatio,
        vx: (Math.random()-0.5) * 0.25 * devicePixelRatio,
        vy: (Math.random()-0.5) * 0.25 * devicePixelRatio,
        r: (1.2 + Math.random()*3.2) * devicePixelRatio,
        h: Math.random()
      });
    }
    let raf;
    const tick = () => {
      ctx.clearRect(0,0,W,H);
      const inkColor = getComputedStyle(document.body).getPropertyValue('--ink').trim();
      const accentColor = getComputedStyle(document.body).getPropertyValue('--accent').trim();
      // connections
      ctx.lineWidth = 0.5 * devicePixelRatio;
      for (let i=0;i<nodes.length;i++){
        for (let j=i+1;j<nodes.length;j++){
          const a = nodes[i], b = nodes[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const d = Math.hypot(dx,dy);
          if (d < 60 * devicePixelRatio){
            const op = (1 - d/(60*devicePixelRatio)) * 0.18;
            ctx.strokeStyle = `${inkColor}${Math.floor(op*255).toString(16).padStart(2,'0')}`;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      // nodes
      for (const n of nodes){
        n.x += n.vx; n.y += n.vy;
        const dx = n.x - CX, dy = n.y - CY;
        const r = Math.hypot(dx,dy);
        if (r > 230 * devicePixelRatio || r < 40*devicePixelRatio){ n.vx *= -1; n.vy *= -1; }
        ctx.fillStyle = n.h < 0.18 ? accentColor : inkColor;
        ctx.globalAlpha = n.h < 0.18 ? 0.7 : 0.35;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} className="hero-art" aria-hidden="true" />;
}

// ————————— Command palette ——————————
function CmdK({ open, onClose }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const items = useMemo(() => {
    const all = [
      { k:'Jump', t:'Home / top', to:'#top' },
      { k:'Jump', t:'About', to:'#about' },
      { k:'Jump', t:'Publications', to:'#publications' },
      { k:'Jump', t:'Research projects', to:'#research' },
      { k:'Jump', t:'Open source', to:'#projects' },
      { k:'Jump', t:'Writing', to:'#writing' },
      { k:'Jump', t:'Contact', to:'#contact' },
      ...DATA.publications.map(p => ({ k:'Paper', t:p.title, to:'#publications' })),
      ...DATA.oss.map(o => ({ k:'Repo', t:o.name + ' — ' + o.desc.slice(0,60), to:o.url, ext:true })),
      ...DATA.posts.map(p => ({ k:'Post', t:p.title.replace(/<[^>]+>/g,''), to:'#writing' })),
      { k:'Link', t:'Email Nigmat', to:'mailto:nigmatrahim4@gmail.com', ext:true },
      { k:'Link', t:'GitHub profile', to:'https://github.com/Nigmat-future', ext:true },
    ];
    const qq = q.toLowerCase().trim();
    if (!qq) return all.slice(0,10);
    return all.filter(i => (i.t + ' ' + i.k).toLowerCase().includes(qq)).slice(0,12);
  }, [q]);
  useEffect(() => { setSel(0); }, [q, open]);
  useEffect(() => {
    if (!open) return;
    const h = (e) => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowDown'){ e.preventDefault(); setSel(s => Math.min(items.length-1, s+1));}
      if (e.key === 'ArrowUp'){ e.preventDefault(); setSel(s => Math.max(0, s-1));}
      if (e.key === 'Enter'){
        const it = items[sel]; if (!it) return;
        if (it.ext){ window.open(it.to,'_blank'); } else { location.hash = it.to; }
        onClose();
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open, items, sel, onClose]);
  if (!open) return null;
  return (
    <div className="cmdk-overlay" onClick={onClose}>
      <div className="cmdk" onClick={e=>e.stopPropagation()}>
        <input autoFocus placeholder="Search papers, repos, posts, pages…" value={q} onChange={e=>setQ(e.target.value)} />
        <div className="cmdk-list">
          {items.length === 0 && <div style={{padding:'30px', textAlign:'center', fontFamily:'var(--serif)', fontStyle:'italic', color:'var(--ink-mute)'}}>No matches. Try "rag", "cellhop", or "kegg".</div>}
          {items.map((it, i) => (
            <div key={i} className={`cmdk-row ${i===sel?'on':''}`} onMouseEnter={()=>setSel(i)} onClick={()=>{
              if (it.ext) window.open(it.to,'_blank'); else location.hash = it.to; onClose();
            }}>
              <span className="ic">{it.k[0]}</span>
              <span>{it.t}</span>
              <span className="tag">{it.k}{it.ext ? ' ↗' : ''}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ————————— Tweaks panel ——————————
function Tweaks({ open, onClose, theme, setTheme, accent, setAccent }) {
  if (!open) return null;
  return (
    <div className="tweaks">
      <div className="tweaks-h">
        <span>Tweaks</span>
        <button className="tweaks-close" onClick={onClose} aria-label="Close">×</button>
      </div>
      <div className="tweaks-b">
        <div className="tweaks-row">
          <label>Theme</label>
          <div className="tweaks-seg">
            {['paper','dark','terminal'].map(t => (
              <button key={t} className={theme===t?'on':''} onClick={()=>setTheme(t)}>{t}</button>
            ))}
          </div>
        </div>
        <div className="tweaks-row">
          <label>Accent</label>
          <div className="tweaks-seg">
            {Object.keys(ACCENTS).map(a => (
              <button key={a} className={accent===a?'on':''} onClick={()=>setAccent(a)}
                style={{borderLeft:accent===a?`2px solid ${ACCENTS[a].light}`:''}}>
                {a}
              </button>
            ))}
          </div>
        </div>
        <div style={{fontFamily:'var(--serif)',fontSize:12,color:'var(--ink-mute)',fontStyle:'italic',marginTop:6,lineHeight:1.5}}>
          Themes and accents persist via the Tweaks toggle in the toolbar.
        </div>
      </div>
    </div>
  );
}

// ————————— App ——————————
function App() {
  const [theme, setTheme] = useState(TWEAKS.theme === 'paper' ? 'paper' : TWEAKS.theme);
  const [accent, setAccent] = useState(TWEAKS.accent);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [progress, setProgress] = useState(0);
  const [activeSec, setActiveSec] = useState('top');

  // apply theme
  useEffect(() => {
    if (theme === 'paper') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  // apply accent
  useEffect(() => {
    const a = ACCENTS[accent] || ACCENTS.oxblood;
    const isDark = theme !== 'paper';
    document.documentElement.style.setProperty('--accent', isDark ? a.dark : a.light);
    document.documentElement.style.setProperty('--accent-soft', a.soft);
  }, [accent, theme]);

  // cmd-k
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); setCmdkOpen(o=>!o); }
      if (e.key === '/' && !cmdkOpen && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setCmdkOpen(true); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [cmdkOpen]);

  // scroll progress + active section
  useEffect(() => {
    const h = () => {
      const s = document.documentElement.scrollTop;
      const max = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      setProgress(max > 0 ? Math.min(100, (s/max)*100) : 0);
      const ids = ['about','publications','research','projects','writing','contact'];
      const y = s + 140;
      let cur = 'top';
      for (const id of ids){
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) cur = id;
      }
      setActiveSec(cur);
    };
    window.addEventListener('scroll', h, { passive: true });
    h();
    return () => window.removeEventListener('scroll', h);
  }, []);

  // tweaks host protocol
  useEffect(() => {
    const h = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    try { window.parent.postMessage({ type:'__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', h);
  }, []);

  // persist
  useEffect(() => {
    try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{ theme, accent }}, '*'); } catch {}
  }, [theme, accent]);

  return (
    <>
      <div className="progress" style={{width: progress + '%'}} />
      <TopBar onOpenCmdk={() => setCmdkOpen(true)} theme={theme} setTheme={setTheme} activeSec={activeSec} />
      <Hero />
      <About />
      <Publications />
      <Research />
      <Projects />
      <Writing />
      <Contact />
      <Footer />
      <CmdK open={cmdkOpen} onClose={() => setCmdkOpen(false)} />
      <Tweaks open={tweaksOpen} onClose={() => setTweaksOpen(false)} theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
